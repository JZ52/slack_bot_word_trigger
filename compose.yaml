services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SQL_DATABASE:?SQL_DATABASE is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?SLACK_APP_TOKEN is required}
      BOT_USER_OAUTH_TOKEN: ${BOT_USER_OAUTH_TOKEN:?BOT_USER_OAUTH_TOKEN is required}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID:?ADMIN_CHANNEL_ID is required}
      emoji: ${emoji:?emoji is required}

      SQL_ADRES: database
      SQL_PORT: "5432"
      SQL_DATABASE: ${SQL_DATABASE:?SQL_DATABASE is required}
      SQL_USER: ${SQL_USER:?SQL_USER is required}
      SQL_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}

    depends_on:
      database:
        condition: service_healthy

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: